# tmux — starter config on top of the defaults.
# Reference: https://github.com/tmux/tmux/wiki
#
# Deliberately no key bindings: the prefix stays C-b and every default binding
# is untouched, so any tmux cheat sheet applies as written.

# Mouse: click to select a pane/window, drag borders, scroll into history
set -g mouse on

# Number windows and panes from 1 — matches their keyboard positions
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Neovim wants both of these: no delay swallowing Esc, and :autoread on focus
set -sg escape-time 10
set -g focus-events on

# Truecolor. The outer terminal (Ghostty) already reports RGB; pass it through.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# Extended keys (CSI u). Without these tmux collapses Shift-Enter, Ctrl-Enter &
# co. down to a plain Enter, so Claude Code can't tell them apart. `on` only
# upgrades keys for programs that ask for them; the feature is negotiated with
# the outer terminal at attach time, so a full detach/reattach is needed.
set -s extended-keys on
set -as terminal-features "xterm-ghostty:extkeys"

set -g history-limit 50000

# ── Gruvbox dark hard ────────────────────────────────────────────────────────
# Flat blocks, no powerline glyphs, so this looks the same on Linux and in any
# font. Colors are explicit hex: truecolor is enabled above, so the bar renders
# as real Gruvbox whatever palette the outer terminal happens to use.

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-style "bg=#1d2021,fg=#a89984"

# Session name — solid block on the left edge
set -g status-left "#[bg=#a89984,fg=#1d2021,bold] #S #[default] "

# Windows — dim block for inactive, yellow block for the current one
set -g window-status-separator " "
set -g window-status-format "#[bg=#3c3836,fg=#a89984] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[bg=#fabd2f,fg=#1d2021,bold] #I:#W#{?window_zoomed_flag, Z,} "

# Date and time on the right
set -g status-right "#[bg=#3c3836,fg=#ebdbb2] %H:%M #[bg=#a89984,fg=#1d2021,bold] %a %d %b "

# Panes, messages and copy mode in the same palette
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#a89984"
set -g message-style "bg=#fabd2f,fg=#1d2021,bold"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#ebdbb2"
set -g clock-mode-colour "#fabd2f"
